    id
    seriesID
    unrevealedCount
    mintLockOwner
    mintLockUntil
    mintLockBlockNumber
    mintLockBlockTimestamp
    mintLockTransactionHash
  }
  revealSummaries: seriesRevealSummaries(
    block: $block
    where: { id_gt: $summaryCursor }
    first: $first
    orderBy: id
    orderDirection: asc
  ) @include(if: $includeSummaries) {
    id
    seriesID
    proofCount
    tokenCount
    latestBlockTimestamp
    latestTransactionHash
  }
  revealTokens: seriesRevealTokens(
    block: $block
    where: { id_gt: $tokenCursor }
    first: $first
    orderBy: id
    orderDirection: asc
  ) @include(if: $includeTokens) {
    id
    seriesID
    tokenID
    summary {
      seriesID
    }
    ticket {
      tokenID
    }
  }
}
